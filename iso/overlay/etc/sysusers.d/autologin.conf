# The group Calamares puts the new account in for autologin.
#
# users.conf names "autologin" as autologinGroup, and if the group does not exist
# useradd fails — which would turn a missing group into a failed installation.
# Arch's sddm package does not create it, so it is declared here, once, in the
# overlay so it exists in the live session and on the installed system alike.
g autologin
