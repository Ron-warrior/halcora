# The live session's account.
#
# systemd-sysusers creates both the user and its matching group at boot, so this
# replaces the tempting-but-wrong approach of shipping hand-written /etc/passwd
# and /etc/group files. Overlaying those wholesale drops the groups Arch's
# `filesystem` package ships (wheel, tty, audio, video…) and takes sudo with it.
#
# No password: autologin means nobody is asked for one, and a locked account is
# the right default for an account that should never be logged into remotely.
u live 1000 "Halcora Live" /home/live /usr/bin/bash
