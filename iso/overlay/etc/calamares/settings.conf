# Calamares configuration for the Halcora live ISO.
#
# An offline install that unpacks the live image: no network is needed, nothing
# is downloaded, and the installed system is exactly the live session. That is
# the least surprising thing an installer can do for someone who has never used
# one, and it is also the least code.
#
# Note on the sequence: `users` appears in BOTH show and exec. The module both
# collects a name in the UI and creates the account during exec; listing it only
# under show produces a beautiful installer that creates no user.

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  # --- questions ---
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  # --- work ---
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - networkcfg
      - hwclock
      - users
      - bootloader
      - displaymanager
      - initcpiocfg
      - initcpio
      - services-systemd
      - umount

  - show:
      - finished

branding: default
prompt-install: false
