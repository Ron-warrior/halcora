# Unpack the live squashfs straight onto the target root.
#
# archiso attaches the ISO at /run/archiso/bootmnt, and profiledef.sh's
# install_dir ("halcora") places the squashfs at <install_dir>/x86_64/.
# A destination of "" means the target root filesystem.
---
unpack:
  - source: "/run/archiso/bootmnt/halcora/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
