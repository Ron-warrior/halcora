---
# "Erase disk" is the only choice offered at this stage. Anything more invites a
# Windows refugee to destroy the Windows install they may still want, before we
# have an install-alongside path worth trusting. That path is phase 4 work.
efiSystemPartition: "/boot"
userSwapChoices:
  - none
  - small
  - suspend
  - file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - btrfs
  - ext4
  - xfs
