---
# The partitioning page opens on "erase disk" and nothing else is chosen for the
# user. It is not the only option Calamares offers — manual partitioning is still
# reachable — but the default must never be the destructive one by accident, and
# "install alongside" is deliberately absent until there is a path worth trusting
# (phase 4). TESTING.md and the README tell testers it is erase-only; this key is
# what makes that true of the default.
initialPartitioningChoice: eraseDisk
initialSwapChoice: small
efiSystemPartition: "/boot"
userSwapChoices:
  - none
  - small
  - suspend
  - file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - btrfs
  - ext4
  - xfs
