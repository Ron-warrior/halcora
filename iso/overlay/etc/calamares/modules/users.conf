---
# One account, created by the user, in the groups a desktop needs. The user is
# the first human being to use this system, not a sysadmin, so root reuses the
# account's password instead of asking for a second one: two passwords on one
# screen is the kind of thing that makes an installer feel like an exam, and sudo
# exists so nobody has to remember which is which.
defaultGroups:
  - users
  - wheel
  - video
  - audio
  - storage
  - networkmanager
  - lp
  - scanner

autologinGroup: autologin
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
allowWeakPasswords: false
