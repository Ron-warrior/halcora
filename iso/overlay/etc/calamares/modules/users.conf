---
# One account, created by the user, in the groups a desktop needs. The user is
# the first human being to use this system, not a sysadmin, so root's password
# is set separately and sudo exists but nothing demands it.
defaultGroups:
  - users
  - wheel
  - video
  - audio
  - storage
  - networkmanager

autologinGroup: autologin
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
allowWeakPasswords: false
