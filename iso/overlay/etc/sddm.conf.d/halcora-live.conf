[Autologin]
User=live
# X11, not Wayland, and only for the live session.
#
# Calamares must run as root, which means pkexec, and a root Qt application
# cannot reach a user's Wayland socket: XDG_RUNTIME_DIR is 0700 and belongs to the
# live user. The failure looks exactly like "clicking Install does nothing".
# Under X11, pkexec plus xhost works and is the arrangement every Calamares
# distribution ships.
#
# The installed system is unaffected; this sets the live session's session only.
Session=plasma

[General]
Numlock=on

[Theme]
Current=breeze
