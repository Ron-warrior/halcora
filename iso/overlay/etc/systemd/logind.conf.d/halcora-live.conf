# Live-session behaviour.
#
# ARCHISO is set by archiso in the live environment, so this file switches a
# couple of things on only there and leaves an installed system alone.

[Manager]
# The live session must never suspend or hibernate the machine it is being
# installed on, and a laptop lid closing mid-install is exactly that.
HandleLidSwitch=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
