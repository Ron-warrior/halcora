# Live-session behaviour.
#
# logind has no conditional drop-ins, so despite the intent this file applies to
# the installed system as well: an installed Halcora will also ignore the lid
# switch and the suspend keys. That is wrong for a laptop and is one of the
# live-session leftovers the installer has to remove (iso/README gap 5, the
# Calamares shellprocess step that does not exist yet).
#
# It stays because a lid closing mid-install on the machine being installed to is
# worse than a desktop that does not suspend.

[Manager]
HandleLidSwitch=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
