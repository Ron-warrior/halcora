name: Check

# A fast guard rail, not a build. The ISO takes ~40 minutes and needs a
# privileged container; this catches the mistakes that would waste that run, in
# about two minutes, on an unprivileged runner.
#
# It exists because the project's history is two CI failures that this would have
# caught for free: a package name that did not exist, and a script that could not
# be executed. An agent with little context makes exactly those mistakes.

on:
  push:
    paths:
      - 'iso/**'
      - 'scripts/**'
      - 'packages/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Fast checks
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 15

    steps:
      # archlinux:latest ships no package databases, so the first command has to
      # sync them. Without -Sy, "archlinux-keyring" is not merely stale, it is
      # "error: target not found", and the job dies in twelve seconds before
      # checking anything. That was this workflow's first failure.
      #
      # The order after that also matters: syncing and then scattering installs
      # is a partial upgrade that fails on signatures, so the keyring is updated
      # first and the full upgrade follows.
      - name: Install tools
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git python-yaml shellcheck

      - uses: actions/checkout@v4

      # Every name in packages.x86_64 must exist in the Arch repositories. A
      # typo here is the single most common way this build dies, and it dies
      # forty minutes in, after Calamares has compiled.
      - name: Package names exist
        run: |
          missing=0
          while IFS= read -r line || [ -n "$line" ]; do
            pkg=${line%%#*}
            pkg=$(printf '%s' "$pkg" | tr -d '[:space:]')
            [ -z "$pkg" ] && continue
            if ! pacman -Si "$pkg" >/dev/null 2>&1; then
              printf '::error file=iso/profile/packages.x86_64::no such package: %s\n' "$pkg"
              missing=1
            fi
          done < iso/profile/packages.x86_64
          exit "$missing"

      - name: Duplicate package entries
        run: |
          dupes=$(sed 's/#.*//' iso/profile/packages.x86_64 \
                  | tr -d '[:space:]' | grep -v '^$' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            printf '::warning::duplicate entries: %s\n' "$dupes"
          fi

      - name: Shell scripts parse
        run: |
          bad=0
          for f in iso/build.sh scripts/* packages/*.sh packages/*/*.sh iso/overlay/usr/local/bin/*; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              printf '::error file=%s::does not parse\n' "$f"
              bad=1
            fi
          done
          exit "$bad"

      - name: Shell scripts linted
        # Advisory only. shellcheck is noisy about style, and style has never
        # broken a build here. Its real findings are printed for a human.
        run: |
          for f in iso/build.sh scripts/* packages/*.sh packages/*/*.sh iso/overlay/usr/local/bin/*; do
            [ -f "$f" ] || continue
            shellcheck --format=gcc --severity=warning "$f" || true
          done

      # A PKGBUILD is shell, so it can be syntax-checked for free. Whether it
      # *builds* needs a real makepkg run against a real pacman repository, which
      # does not exist yet, so this deliberately claims much less than that.
      - name: Package recipes parse and match their directory
        run: |
          status=0
          for f in packages/*/PKGBUILD; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              printf '::error file=%s::does not parse as shell\n' "$f"
              status=1
            fi
            dir=$(basename "$(dirname "$f")")
            name=$(sed -n 's/^pkgname=//p' "$f" | head -n1)
            if [ "$name" != "$dir" ]; then
              printf '::error file=%s::pkgname %s does not match directory %s\n' \
                "$f" "$name" "$dir"
              status=1
            fi
          done
          exit "$status"

      # The layout switcher names Global Theme ids. A package that forgets to
      # install one of them, or renames it, leaves the flagship feature doing
      # nothing — and nothing else in CI would notice.
      - name: Every layout id the switcher asks for is produced
        run: |
          status=0
          ids=$(sed -n 's/^\(win\|macos\)_id=//p' scripts/halcora-layout)
          if [ -z "$ids" ]; then
            echo '::error file=scripts/halcora-layout::no layout ids found'
            exit 1
          fi
          for id in $ids; do
            if ! grep -rqs "_id=$id" packages/; then
              printf '::error file=scripts/halcora-layout::no package produces %s\n' "$id"
              status=1
            fi
          done
          exit "$status"

      # For a git source, makepkg checks the tree out into a directory named after
      # the source's alias. A friendly alias ("fluent-kde" for Fluent-kde) then
      # leaves `cd "$srcdir/Fluent-kde"` pointing at nothing, and the build fails
      # on a missing directory rather than on anything to do with the package.
      - name: Source alias matches the directory the build uses
        run: |
          status=0
          for f in packages/*/PKGBUILD; do
            [ -f "$f" ] || continue
            alias=$(sed -n 's/^source=("\([^:]*\)::.*/\1/p' "$f" | head -n1)
            [ -n "$alias" ] || continue
            if ! grep -q "srcdir/$alias" "$f"; then
              printf '::error file=%s::source alias %s is never used as $srcdir/%s\n' \
                "$f" "$alias" "$alias"
              status=1
            fi
          done
          exit "$status"

      # A malformed .colors file does not fail a build: KDE simply ignores it
      # and the desktop falls back to Breeze, so the first symptom is a user
      # saying "the theme did nothing". KConfig's format is not quite INI —
      # [Colors:Header][Inactive] is a real section name — so this parses it by
      # hand rather than with configparser, which would mangle that.
      - name: Colour schemes are well formed
        run: |
          python - <<'PY'
          import glob
          import re
          import sys

          required = ("BackgroundNormal", "DecorationFocus", "DecorationHover",
                      "ForegroundNormal")

          bad = 0
          files = sorted(glob.glob("packages/*/color-schemes/*.colors"))
          if not files:
              print("::error::no .colors files found")
              sys.exit(1)

          for path in files:
              sections = {}
              current = None
              for number, raw in enumerate(open(path), 1):
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith(";"):
                      continue
                  if line.startswith("[") and line.endswith("]"):
                      current = line[1:-1]
                      sections.setdefault(current, {})
                      continue
                  if "=" not in line:
                      print(f"::error file={path},line={number}::not a key=value line")
                      bad = 1
                      continue
                  key, value = line.split("=", 1)
                  if current is None:
                      print(f"::error file={path},line={number}::key outside a section")
                      bad = 1
                      continue
                  sections[current][key.strip()] = value.strip()

              for name in ("General", "Colors:Window", "Colors:View",
                           "Colors:Button", "Colors:Selection"):
                  if name not in sections:
                      print(f"::error file={path}::missing section [{name}]")
                      bad = 1

              for name, keys in sections.items():
                  if not name.startswith("Colors:"):
                      continue
                  for key in required:
                      if key not in keys:
                          print(f"::error file={path}::[{name}] missing {key}")
                          bad = 1
                  for key, value in keys.items():
                      if not re.fullmatch(r"\d+,\d+,\d+(,\d+)?", value):
                          print(f"::error file={path}::[{name}] {key}={value} is not "
                                f"an R,G,B triple")
                          bad = 1

              general = sections.get("General", {})
              if "Name" not in general:
                  print(f"::error file={path}::[General] has no Name")
                  bad = 1

          print(f"checked {len(files)} colour scheme(s)")
          sys.exit(bad)
          PY

      # docs/DESIGN.md: the palette lives in halcora-theme-hyperos and nowhere
      # else, or a layout could not wear it without layout code changing. This is
      # the cheapest possible guard for that rule: no literal #rrggbb outside the
      # directories allowed to have them.
      #
      # halcora-branding is allowed because a logo's own colours are brand
      # assets, not a themeable palette — there is nothing to re-skin there.
      # os-release's ANSI_COLOR is an escape sequence for terminal prompts, not a
      # UI colour, so it is outside this guard by design. Every #rrggbb belongs
      # in the theme package.
      - name: The palette lives only in the HyperOS theme
        run: |
          status=0
          found=$(grep -rIlE '#[0-9A-Fa-f]{6}' \
                    iso packages scripts 2>/dev/null \
                  | grep -v '^packages/halcora-theme-hyperos/' \
                  | grep -v '^packages/halcora-branding/' || true)
          if [ -n "$found" ]; then
            for f in $found; do
              printf '::error file=%s::hard-coded colour outside halcora-theme-hyperos\n' "$f"
              status=1
            done
          fi
          exit "$status"

      # halcora-defaults names a colour scheme in /etc/skel. If that scheme is
      # missing — renamed, or the theme package not installed — a new account
      # silently gets Breeze blue and never sees HyperOS, with no error anywhere.
      - name: Every colour scheme a default names exists
        run: |
          status=0
          refs=$(grep -rhoE '^ColorScheme=[^[:space:]]+' packages/*/skel/ 2>/dev/null \
                 | cut -d= -f2 || true)
          if [ -z "$refs" ]; then
            echo '::warning::no ColorScheme found in any skel; nothing to check'
            exit 0
          fi
          for ref in $refs; do
            if ! grep -rqs "^Name=$ref\$" packages/*/color-schemes/; then
              printf '::error::a default names colour scheme %s and no package provides it\n' "$ref"
              status=1
            fi
          done
          exit "$status"

      - name: Calamares configuration parses
        run: |
          python - <<'PY'
          import glob
          import sys

          import yaml

          bad = 0
          files = sorted(glob.glob("iso/overlay/etc/calamares/**/*.conf", recursive=True)
                         + glob.glob("packages/*/calamares/*.desc"))
          if not files:
              print("::error::no Calamares configuration found")
              sys.exit(1)
          for path in sorted(files):
              try:
                  with open(path) as handle:
                      yaml.safe_load(handle)
              except Exception as exc:  # noqa: BLE001 - report anything
                  print(f"::error file={path}::{exc}")
                  bad = 1
          print(f"parsed {len(files)} file(s)")
          sys.exit(bad)
          PY

      # The same class of failure as the ISO package list, one level down: a
      # dependency name that does not exist is only discovered when pacman tries
      # to resolve it, which is after the sources have been fetched. Our own
      # packages are skipped, since they are not in the repositories yet.
      - name: Package dependencies exist
        run: |
          python - <<'PY'
          import glob
          import re
          import subprocess
          import sys

          names = set()
          for path in sorted(glob.glob("packages/*/PKGBUILD")):
              text = open(path).read()
              for field in ("depends", "makedepends", "optdepends"):
                  for block in re.findall(rf"^{field}=\((.*?)\)", text, re.S | re.M):
                      for entry in re.findall(r"'([^']+)'", block):
                          name = entry.split(":")[0].strip()
                          if name.startswith("halcora-"):
                              continue
                          if name:
                              names.add((name, path))

          missing = 0
          for name, path in sorted(names):
              result = subprocess.run(["pacman", "-Si", name],
                                      stdout=subprocess.DEVNULL,
                                      stderr=subprocess.DEVNULL)
              if result.returncode != 0:
                  print(f"::error file={path}::no such package in the repositories: {name}")
                  missing = 1
          print(f"checked {len(names)} dependenc{'y' if len(names) == 1 else 'ies'}")
          sys.exit(missing)
          PY

      # A module config that settings.conf never names is a typo: Calamares loads
      # modules by the names in its sequence, and a misspelled entry silently
      # runs nothing while its .conf sits there looking correct.
      - name: Every Calamares module config is used
        run: |
          status=0
          for cfg in iso/overlay/etc/calamares/modules/*.conf; do
            [ -f "$cfg" ] || continue
            module=$(basename "$cfg" .conf)
            if ! grep -qE "(^|[[:space:]-])$module([[:space:]]|$)" \
                 iso/overlay/etc/calamares/settings.conf; then
              printf '::error file=%s::module %s is configured but settings.conf never names it\n' \
                "$cfg" "$module"
              status=1
            fi
          done
          exit "$status"

      # An SVG with a syntax error renders as nothing, and a wallpaper that
      # silently renders as nothing is indistinguishable from "Plasma ignored
      # it". XML well-formedness is cheap to check and catches the typo class.
      - name: SVGs are well formed
        run: |
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          bad = 0
          files = sorted(glob.glob("packages/**/*.svg", recursive=True))
          if not files:
              print("::warning::no SVG files found")
              sys.exit(0)
          for path in files:
              try:
                  ET.parse(path)
              except Exception as exc:  # noqa: BLE001 - report anything
                  print(f"::error file={path}::{exc}")
                  bad = 1
          print(f"parsed {len(files)} SVG(s)")
          sys.exit(bad)
          PY

      # KPackage metadata and the featured listing are JSON that Plasma and
      # Discover read silently: a stray comma makes a theme or a wallpaper simply
      # not appear, with nothing in any log to say why.
      - name: JSON files parse
        run: |
          python - <<'PY'
          import glob
          import json
          import sys

          bad = 0
          files = sorted(glob.glob("packages/**/*.json", recursive=True)
                         + glob.glob("store/*.json"))
          if not files:
              print("::warning::no JSON files found")
              sys.exit(0)
          for path in files:
              try:
                  json.load(open(path))
              except Exception as exc:  # noqa: BLE001 - report anything
                  print(f"::error file={path}::{exc}")
                  bad = 1
          print(f"parsed {len(files)} JSON file(s)")
          sys.exit(bad)
          PY

      # Discover ignores a listing it cannot parse, so a malformed featured.json
      # means an empty "Editor's Choice" section and nothing in any log.
      - name: Featured listing is a list of appstream ids
        run: |
          python - <<'PY'
          import json
          import sys

          path = "store/featured.json"
          try:
              data = json.load(open(path))
          except Exception as exc:  # noqa: BLE001 - report anything
              print(f"::error file={path}::{exc}")
              sys.exit(1)

          if not isinstance(data, list) or not data:
              print(f"::error file={path}::expected a non-empty JSON array")
              sys.exit(1)

          bad = 0
          for entry in data:
              if not isinstance(entry, str) or not entry.startswith("appstream://"):
                  print(f"::error file={path}::not an appstream id: {entry!r}")
                  bad = 1
          print(f"checked {len(data)} featured entries")
          sys.exit(bad)
          PY

      # iso/build.sh appends a hard-coded list of our packages to the profile. A
      # renamed or removed package there fails at pacman time, forty minutes in,
      # naming a package that no longer exists.
      - name: The image's package list matches packages that exist
        run: |
          status=0
          names=$(sed -n '/^halcora-[a-z0-9-]*$/p' iso/build.sh | sort -u)
          if [ -z "$names" ]; then
            echo '::warning::no halcora packages named in iso/build.sh'
            exit 0
          fi
          for name in $names; do
            if [ ! -f "packages/$name/PKGBUILD" ]; then
              printf '::error file=iso/build.sh::no such package directory: %s\n' "$name"
              status=1
            fi
          done
          printf 'checked %s package name(s)\n' "$(printf '%s\n' $names | wc -l)"
          exit "$status"

      # The Windows layout's contents/defaults names an Aurorae decoration, and
      # the HyperOS theme installs one. If the two names drift apart KWin falls
      # back to a stock decoration and the window buttons stop matching the
      # rest of the skin — a visual bug with no error anywhere.
      - name: The decoration the layout names is the one the theme installs
        run: |
          status=0
          if ! grep -qs 'aurorae__svg__HalcoraHyperOS' \
               packages/halcora-lookandfeel-win/PKGBUILD; then
            echo '::error file=packages/halcora-lookandfeel-win/PKGBUILD::does not name the HalcoraHyperOS decoration'
            status=1
          fi
          if ! grep -qs 'themes/HalcoraHyperOS' \
               packages/halcora-theme-hyperos/PKGBUILD; then
            echo '::error file=packages/halcora-theme-hyperos/PKGBUILD::does not install the HalcoraHyperOS decoration'
            status=1
          fi
          exit "$status"

      # install_dir is duplicated into unpackfs.conf by hand. If they diverge,
      # every install produces an unbootable disk and the error surfaces only
      # after a reboot on real hardware.
      - name: install_dir matches the installer's squashfs path
        run: |
          install_dir=$(sed -n 's/^install_dir="\(.*\)"$/\1/p' iso/profile/profiledef.sh)
          [ -n "$install_dir" ] || { echo '::error::install_dir not set in profiledef.sh'; exit 1; }
          printf 'install_dir=%s\n' "$install_dir"
          if ! grep -q "/$install_dir/x86_64/airootfs.sfs" \
               iso/overlay/etc/calamares/modules/unpackfs.conf; then
            echo "::error file=iso/overlay/etc/calamares/modules/unpackfs.conf::path does not match install_dir=$install_dir"
            exit 1
          fi
